name: Build and deploy directory
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check curated list
        run: python3 scripts/check.py
      - name: Build site from curated Markdown
        run: python3 scripts/build-site.py
      - name: Check generated pages and search behavior
        run: |
          python3 -m unittest discover -s tests
          node --test tests/search.test.mjs
      - name: Install browser regression tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Check narrow layouts, context and evidence lookup
        run: npm run test:browser
      - name: Upload public site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy directory
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
